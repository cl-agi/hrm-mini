[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hrm-ired"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["hrm", "ema-pytorch", "Pillow", "ipython", "ipdb", "matplotlib", "mkl-service", "pandas", "scipy", "tabulate", "torchvision", "torch", "numpy", "einops", "einshape", "accelerate", "tqdm"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
