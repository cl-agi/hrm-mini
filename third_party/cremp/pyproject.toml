[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hrm-cremp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["hrm-ringer-snapshot", "transformers==4.49.0", "typer", "einops", "hrm", "torch", "numpy", "pandas", "scipy", "rdkit"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
hrm_cremp = ["vendor/ringer/ringer/sidechain_reconstruction/data/*.pickle"]
