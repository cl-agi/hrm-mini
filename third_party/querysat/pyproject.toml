[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hrm-querysat"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["tensorflow==2.15.1", "tensorflow-probability==0.23.0", "numpy==1.26.4", "keras==2.15.0", "tensorflow-addons==0.23.0", "typeguard<3", "networkx==3.6.1", "cnfgen==0.9.5", "python-sat==1.9.dev2"]

[project.optional-dependencies]
gpu = ["tensorflow[and-cuda]==2.15.1"]
evaluation = ["huggingface-hub>=0.24,<1", "pyarrow>=17,<24"]

[tool.setuptools.packages.find]
where = ["src"]
